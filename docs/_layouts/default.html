<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.title != site.title %}{{ page.title | escape }} | {% endif %}{{ site.title | escape }}</title>
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
  <script src="{{ '/assets/site.js' | relative_url }}" defer></script>
</head>
<body>
  <header class="site-header" aria-label="Site header">
    <div class="masthead">
      <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title | escape }}</a>
      <p>{{ site.description | escape }}</p>
    </div>
    <nav class="site-nav" aria-label="Primary navigation">
      <a href="{{ '/pages/about/' | relative_url }}">About</a>
      <a href="{{ '/pages/syllabus/' | relative_url }}">Syllabus</a>
      <a href="{{ '/pages/spring-2026-calendar/' | relative_url }}">Calendar</a>
      <a href="{{ '/pages/readings/' | relative_url }}">Readings</a>
      <a href="{{ '/pages/projects-3/' | relative_url }}">Projects</a>
      <a href="{{ '/posts/' | relative_url }}">Announcements</a>
    </nav>
  </header>
  <main>
{{ content }}
  </main>
</body>
</html>
