---
layout: default
---
    <section class="hero home-hero">
      <div class="hero-banner" role="img" aria-label="Science and Authority course artwork">
        <div class="hero-banner-copy">
          <h1>{{ site.title | escape }}</h1>
          <p>{{ site.description | escape }}</p>
        </div>
      </div>
      <div class="hero-copy">
        <nav class="hero-nav" aria-label="Course pages">
          <a href="{{ '/pages/about/' | relative_url }}">About</a>
          <a href="{{ '/pages/syllabus/' | relative_url }}">Syllabus</a>
          <a href="{{ '/pages/spring-2026-calendar/' | relative_url }}">Calendar</a>
          <a href="{{ '/pages/readings/' | relative_url }}">Readings</a>
          <a href="{{ '/pages/projects-3/' | relative_url }}">Projects</a>
          <a href="{{ '/posts/' | relative_url }}">Announcements</a>
        </nav>
      </div>
    </section>

    <section class="section home-announcements">
      <div class="section-heading">
        <p class="eyebrow">Recent posts</p>
        <h2>Announcements</h2>
      </div>
      <ol class="post-list">
        {% for item in site.posts %}
        <li>
          <a href="{{ item.url | relative_url }}">{{ item.title | escape }}</a>
          <span>{{ item.date | date: "%b %-d, %Y" }}</span>
        </li>
        {% endfor %}
      </ol>
    </section>
